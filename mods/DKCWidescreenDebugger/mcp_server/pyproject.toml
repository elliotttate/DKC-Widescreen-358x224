[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superzsnes-debug-mcp"
version = "0.1.0"
description = "MCP server for live SuperZSNES CPU, memory, PPU, and widescreen debugging"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.26,<2",
]

[project.scripts]
superzsnes-mcp = "superzsnes_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/superzsnes_mcp"]
